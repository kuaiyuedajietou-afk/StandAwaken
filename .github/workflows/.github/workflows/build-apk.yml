
姓名: 构建Android安装包

在……之上:
workflow_dispatch:
推:
路径:
      - 'StandAwakenAndroid_Project-2.zip'
      - '.github/workflows/build-apk.yml'

招聘:
建立:
run-on: ubuntu-最新

步骤:
