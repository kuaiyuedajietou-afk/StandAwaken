name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StandAwakenAndroid_Project-2.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract game
        run: |
          unzip -q StandAwakenAndroid_Project-2.zip -d source

      - name: Build APK
        run: |
          cd source/StandAwakenAndroid
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StandAwaken-APK
          path: source/StandAwakenAndroid/app/build/outputs/apk/debug/app-debug.apk
